<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScopeCollider</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      line-height: 1.4;
    }

    .tagline {
      font-size: 2.4rem;
      opacity: 0.8;
      margin-top: 1.4rem;
      margin-bottom: 1.0rem;
      letter-spacing: 0.03em;
    }

    .hook {
      font-size: 2.1rem;
      opacity: 0.2;
      letter-spacing: 0.07em;
    }
    .hook a {
      color: inherit;
      text-decoration: none;
    }
    .hook a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ScopeCollider SVG wordmark -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1200 240"
      role="img"
      aria-label="ScopeCollider"
      style="shape-rendering:geometricPrecision; text-rendering:optimizeLegibility; display:block; margin:0 auto; max-width:720px; width:100%; height:auto;"
    >
      <title>ScopeCollider</title>
      <style>
        .w {
          fill: #fff;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          font-size: 140px;
          font-weight: 800;
          font-style: italic;
          letter-spacing: 1px; /* IMPORTANT: no artificial gaps */
        }
      </style>
      <defs>
        <mask id="hex-cut">
          <!-- Everything visible by default -->
          <rect x="0" y="0" width="1200" height="240" fill="white" />

          <!-- Hexagon hole (masked out of the 'o' only) -->
          <g transform="translate(599 111) skewX(-9) scale(0.972)">
            <polygon
              shape-rendering="geometricPrecision"
              vector-effect="non-scaling-stroke"
              points="
                0,-36
                31,-18
                31,18
                0,36
                -31,18
                -31,-18
              "
              fill="black"
            />
          </g>
        </mask>
      </defs>

      <text
        class="w"
        x="120"
        y="160"
        mask="url(#hex-cut)"
      >
        ScopeCollider
      </text>
    </svg>

    <div class="tagline">Inter-domain expertise. Liminal execution.</div>
    <div class="hook">
      <a href="mailto:cody.thompson@outlook.com">Embrace the grey</a>
    </div>
  </div>
</body>
</html>
