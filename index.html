<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScopeCollider</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      line-height: 1.4;
    }

    .tagline {
      font-size: 1.15rem;
      opacity: 0.9;
      margin-bottom: 1.6rem;
    }

    .contact {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 1.6rem;
    }

    .hook {
      font-size: 0.8rem;
      opacity: 0.5;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ScopeCollider wordmark -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1200 300"
      role="img"
      aria-label="ScopeCollider"
      style="display:block; margin:0 auto; max-width:720px; width:100%; height:auto;"
    >
      <title>ScopeCollider</title>

      <style>
        .w {
          fill: #fff;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                       Helvetica, Arial, sans-serif;
          font-size: 112px;
          font-weight: 800;
          font-style: italic;
          letter-spacing: 6px;
        }
        .hex {
          fill: #fff;
        }
      </style>

      <!-- Left text: "ScopeC" -->
      <text class="w" x="0" y="190">ScopeC</text>

      <!-- Hexagon replacing the "o" in Collider -->
      <g transform="translate(625, 160)">
        <polygon
          class="hex"
          points="
            0,-34
            29.444, -17
            29.444, 17
            0, 34
            -29.444, 17
            -29.444, -17
          "
        />
      </g>

      <!-- Right text: "llider" -->
      <text class="w" x="675" y="190">llider</text>
    </svg>

    <div class="tagline">Where ambiguity collapses into execution.</div>
    <div class="contact">contact@youremail.com</div>
    <div class="hook">Embrace the grey.</div>

  </div>
</body>
</html>
