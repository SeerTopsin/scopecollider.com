<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScopeCollider</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      line-height: 1.4;
    }

    .tagline {
      font-size: 1.15rem;
      opacity: 0.9;
      margin-bottom: 1.6rem;
    }

    .contact {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 1.6rem;
    }

    .hook {
      font-size: 0.8rem;
      opacity: 0.5;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ScopeCollider wordmark (tight, logo-grade SVG) -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1200 200"
      role="img"
      aria-label="ScopeCollider"
      style="display:block; margin:0 auto 1.4rem; max-width:720px; width:100%; height:auto;"
    >
      <defs>
        <style>
          :root {
            --fill: #fff;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Helvetica, Arial, sans-serif;

            --fs: 112px;
            --fw: 800;
            --italic: italic;
            --ls: 6px;

            --baseline: 136px;

            /* primary tuning knobs */
            --hex_r: 34px;     /* hex size */
            --gap: 4px;        /* VERY tight spacing */
          }

          .word {
            fill: var(--fill);
            font-family: var(--font);
            font-size: var(--fs);
            font-weight: var(--fw);
            font-style: var(--italic);
            letter-spacing: var(--ls);
          }

          .hex {
            fill: var(--fill);
          }
        </style>
      </defs>

      <!-- Left text -->
      <text class="word" x="0" y="0" transform="translate(0, var(--baseline))">
        ScopeC
      </text>

      <!-- Hexagon (acts as the "o") -->
      <g transform="translate(610, 112)">
        <polygon
          class="hex"
          points="
            0,-1
            0.8660254,-0.5
            0.8660254,0.5
            0,1
            -0.8660254,0.5
            -0.8660254,-0.5
          "
          transform="scale(var(--hex_r))"
        />
      </g>

      <!-- Right text: tightly coupled -->
      <text
        class="word"
        x="0"
        y="0"
        transform="
          translate(
            calc(610px + (0.8660254 * var(--hex_r)) + var(--gap)),
            var(--baseline)
          )
        "
      >
        llider
      </text>
    </svg>

    <div class="tagline">Where ambiguity collapses into execution.</div>
    <div class="contact">contact@youremail.com</div>
    <div class="hook">Embrace the grey.</div>

  </div>
</body>
</html>
